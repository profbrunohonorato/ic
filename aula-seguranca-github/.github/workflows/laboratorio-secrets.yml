name: Laboratório - Secrets e Variables

on:
  workflow_dispatch:

permissions: {}

jobs:
  demonstracao:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: laboratorio
    steps:
      - name: Validar configuração sem revelar o segredo
        env:
          APP_STAGE: ${{ vars.APP_STAGE }}
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STAGE" || { echo "Cadastre a Variable APP_STAGE no environment laboratorio."; exit 1; }
          test -n "$DEMO_TOKEN" || { echo "Cadastre o Secret DEMO_TOKEN no environment laboratorio."; exit 1; }
          printf 'Ambiente configurado: %s\n' "$APP_STAGE"
          echo "Secret disponível apenas neste passo; valor não exibido."
